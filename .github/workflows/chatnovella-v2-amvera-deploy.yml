name: Verify standalone V2 Amvera configuration
on:
  push:
    branches:
      - deploy/chatnovella-v2-amvera-20261124
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only V2 runtime and test dependencies
        run: python -m pip install -r novella_v2/requirements.txt httpx PyYAML
      - name: Validate Amvera manifest
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          config = yaml.safe_load(Path('amvera.yaml').read_text())
          assert config['meta']['environment'] == 'python'
          assert config['build']['requirementsPath'] == 'novella_v2/requirements.txt'
          assert config['run']['command'] == 'uvicorn novella_v2.amvera_entry:app --host 0.0.0.0 --port 8080 --workers 1'
          assert config['run']['containerPort'] == 8080
          assert config['run']['persistenceMount'] == '/data'
          print('STANDALONE_V2_MANIFEST_OK')
          PY
      - name: Compile V2 application
        run: python -m compileall -q novella_v2
      - name: Test V2 runtime and deployment protection
        run: python -m unittest discover -s novella_v2/tests -v
