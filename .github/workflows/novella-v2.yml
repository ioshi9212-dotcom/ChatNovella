name: Test ChatNovella V2
on:
  push:
    branches:
      - main
      - 'test/novella-v2-**'
    paths:
      - 'novella_v2/**'
      - '.github/workflows/novella-v2.yml'
  pull_request:
    paths:
      - 'novella_v2/**'
      - '.github/workflows/novella-v2.yml'
  workflow_dispatch:

jobs:
  v2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install V2 API/test dependencies
        run: python -m pip install -r novella_v2/requirements.txt httpx
      - name: Compile engine and API
        run: python -m compileall -q novella_v2
      - name: Test storage, API, history, rollback and audits
        run: python -m unittest discover -s novella_v2/tests -v
      - name: Confirm OpenAPI endpoint
        run: python -c "from novella_v2.api import app; assert app.openapi()['info']['title'] == 'ChatNovella V2'"
