name: Check ChatNovella Lite
on:
  push:
    branches: [main, feature/chatnovella-lite, 'fix/**']
  pull_request:
    branches: [main]

jobs:
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q chatnovella_lite tests_lite
      - run: python -m unittest discover -s tests_lite -v
      - run: python scripts/lite_smoke.py
      - name: Import isolated test service
        env:
          CHATNOVELLA_LITE_DATA_DIR: ./ci_lite_data
        run: python -c "from chatnovella_lite.server import app; assert app.openapi()['info']['title'] == 'ChatNovella Lite'"
