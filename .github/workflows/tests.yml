name: Check ChatNovella
on:
  push:
    branches: [main, feature/chatnovella-state-templates]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q chatnovella tests
      - name: Run state tests
        run: python -m unittest discover -s tests -v
      - name: Verify MCP module starts without secrets
        env:
          CHATNOVELLA_DATA_DIR: ./ci_local_data
        run: python -c "from chatnovella.mcp_server import app; print('MCP ASGI import OK without token')"
