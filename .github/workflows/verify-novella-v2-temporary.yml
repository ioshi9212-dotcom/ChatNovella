name: Verify isolated ChatNovella V2
on:
  push:
    branches: ['feature/novella-v2-isolated-20261123']
  workflow_dispatch:

jobs:
  v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V2
        run: python -m compileall -q novella_v2
      - name: Run V2 storage tests
        run: python -m unittest discover -s novella_v2/tests -v
      - name: Verify standalone API import
        run: |
          python -m pip install -r novella_v2/requirements.txt
          python -c "from novella_v2.api import app; assert app.openapi()['info']['title'] == 'ChatNovella V2'"
