# Main ChatNovella Amvera service now runs V2 only.
# Older Lite code and its /data/chatnovella-lite storage are left untouched.
meta:
  environment: python
  toolchain:
    name: pip
    version: '3.12'
build:
  requirementsPath: novella_v2/requirements.txt
run:
  command: uvicorn novella_v2.amvera_entry:app --host 0.0.0.0 --port 8080 --workers 1
  containerPort: 8080
  persistenceMount: /data
